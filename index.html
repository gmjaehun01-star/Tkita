<style>
:root{
  --blue:#2848F8; --blue-2:#3F6BFF; --blue-d:#1B36D6; --blue-x:#5B86FF;
  --ink:#0F1626; --char:#1A1F2E; --char-2:#242A3B;
  --text:#1E2430; --mute:#66708A; --line:#E1E6F5; --sky:#EEF2FF; --sky-2:#F6F8FF;
  --grad:linear-gradient(135deg,#3F6BFF 0%,#2848F8 55%,#1B36D6 100%);
  --f:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --mx:1180px; --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--text);font-family:var(--f);font-size:17px;line-height:1.72;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;color:var(--ink);font-weight:800;letter-spacing:-.03em;line-height:1.18}
.wrap{max-width:var(--mx);margin:0 auto;padding:0 28px}
.sec{padding:96px 0}
.sec--sky{background:var(--sky-2)}
.sec--char{background:var(--char);color:#fff}
.sec--char h2{color:#fff}
h2{font-size:clamp(28px,3.4vw,40px)}
.lead{color:var(--mute);margin-top:14px;max-width:58ch;font-size:17px;white-space:pre-line}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 태그·버튼 */
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--sky);color:var(--blue);
  font-size:13px;font-weight:700;letter-spacing:.02em}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--blue);display:block}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:12px;font-weight:700;font-size:16px;
  text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn--grad{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(40,72,248,.28)}
.btn--grad:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(40,72,248,.36)}
.btn--white{background:#fff;color:var(--blue);border-color:#fff}
.btn--white:hover{background:var(--sky)}
.btn--line{border-color:var(--line);color:var(--ink);background:#fff}
.btn--line:hover{border-color:var(--blue);color:var(--blue)}
.btn--ghost{border-color:rgba(255,255,255,.45);color:#fff}
.btn--ghost:hover{background:rgba(255,255,255,.12)}
.btn--sm{padding:9px 16px;font-size:14px;border-radius:10px}

/* 상단 */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:32px;height:70px}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:28px;width:auto}
nav{display:flex;gap:24px;margin-left:auto}
nav a{text-decoration:none;display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:6px 2px;
  border-bottom:2px solid transparent;margin-bottom:-2px}
nav a b{font-size:14px;font-weight:700;color:var(--ink)}
nav a i{font-style:normal;font-size:11.5px;color:var(--mute);margin-top:2px}
nav a:hover b,nav a.on b{color:var(--blue)}
nav a.on{border-color:var(--blue)}

/* 첫 화면 */
.hero{background:linear-gradient(180deg,#fff 0%,var(--sky-2) 100%);padding:80px 0 88px;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(38px,5.4vw,64px);margin-top:22px}
.hero .lead{margin-top:22px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.hero .where{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px}
.hero .where span{font-size:13px;color:var(--mute);border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}

/* 자막 패널 (제품 UI 모사) */
.cap{background:var(--char);color:#fff;border-radius:var(--r) var(--r) var(--r) 6px;box-shadow:0 30px 60px rgba(15,22,38,.28);
  border:1px solid #2C3348;position:relative}
.cap__bar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #2C3348}
.cap__pill{font-size:11.5px;font-weight:700;color:#7CF29A;border:1px solid #2FA653;border-radius:999px;padding:3px 9px;letter-spacing:.04em}
.cap__rec{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:#9AA3BC;margin-left:auto}
.cap__rec i{width:8px;height:8px;border-radius:50%;background:#FF4D4D;display:block;animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.cap__body{padding:24px 22px 26px}
.cap__ko{font-size:clamp(20px,2.2vw,26px);font-weight:700;line-height:1.4;min-height:2.9em;letter-spacing:-.01em}
.cap__ko .caret{display:inline-block;width:2.5px;height:1em;background:var(--blue-x);vertical-align:-3px;margin-left:4px;animation:blink 1s infinite}
.cap__tr{margin-top:18px;display:grid;gap:10px}
.cap__row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.cap__row.show{opacity:1;transform:none}
.cap__lang{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--blue);border-radius:6px;padding:3px 7px;margin-top:3px;letter-spacing:.04em;white-space:nowrap}
.cap__txt{font-size:15px;color:#D5DBEE;background:var(--char-2);border-radius:10px 10px 10px 3px;padding:8px 12px}
.cap__foot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid #2C3348;font-family:var(--mono);font-size:11.5px;color:#7C86A3}
.cap__foot b{color:#B8C2DC;font-weight:600}

/* 작동 원리 */
.how{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:18px;align-items:center;margin-top:44px}
.how__step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 26px;min-height:190px}
.how__step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;font-weight:800;font-size:14px}
.how__step b{display:block;font-size:19px;color:var(--ink);margin-top:16px;letter-spacing:-.02em}
.how__step p{font-size:15px;color:var(--mute);margin-top:8px}
.how__arrow{color:var(--blue);font-size:26px;font-weight:300}
.how__langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.how__langs span{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--blue);background:var(--sky);border-radius:6px;padding:3px 7px}

/* 제품 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:44px}
.tile{text-decoration:none;display:flex;flex-direction:column;border-radius:var(--r);background:#fff;border:1px solid var(--line);overflow:hidden;
  transition:transform .2s,box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(40,72,248,.16);border-color:transparent}
.tile__art{background:var(--grad);height:230px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:26px 22px 0}
.tile__art::before{content:"";position:absolute;inset:auto -30% -55% -30%;height:70%;background:rgba(255,255,255,.08);border-radius:50%}
.tile__art img{max-height:100%;width:auto;max-width:100%;border-radius:8px 8px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.28);position:relative}
.tile__body{padding:22px 22px 24px}
.tile__body b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em}
.tile__body em{font-style:normal;display:block;color:var(--blue);font-weight:700;font-size:14px;margin-top:2px}
.tile__body p{font-size:14.5px;color:var(--mute);margin-top:12px;line-height:1.6}
.tile__body u{display:inline-block;text-decoration:none;color:var(--blue);font-weight:700;font-size:14px;margin-top:14px}

/* 수치 */
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:44px}
.fig{background:var(--char-2);border:1px solid #2C3348;border-radius:var(--r) var(--r) var(--r) 6px;padding:28px 26px}
.fig b{display:block;font-size:clamp(34px,4vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1;
  background:linear-gradient(135deg,#8FB0FF,#5B86FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.fig span{display:block;font-size:14px;color:#9AA3BC;margin-top:12px}
.figs-note{font-size:13px;color:#7C86A3;margin-top:18px}

/* 레퍼런스 티커 */
.ticker{margin-top:36px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker__track{display:flex;width:max-content;gap:14px;animation:slide 40s linear infinite}
.ticker:hover .ticker__track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.tk{flex:none;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;
  padding:14px 26px;font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;min-height:64px}
.tk img{height:36px;width:auto;max-width:180px;object-fit:contain}
@media (prefers-reduced-motion:reduce){.ticker{overflow-x:auto}.ticker__track{animation:none}.cap__row{transition:none}}

/* 체험 (그라데이션 블록) */
.trial{background:var(--grad);color:#fff;border-radius:24px 24px 24px 8px;padding:56px 56px 52px;position:relative;overflow:hidden}
.trial::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08)}
.trial h2{color:#fff;font-size:clamp(28px,3.4vw,40px)}
.trial .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px;position:relative}
.trial .col{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px 16px 16px 5px;padding:24px 24px 26px}
.trial .col b{display:block;font-size:18px;margin-bottom:8px}
.trial .col p{font-size:15px;color:#E4EBFF;margin-bottom:18px}

/* 바닥 */
footer{background:var(--ink);color:#9AA3BC;padding:52px 0 48px;font-size:14px}
.fgrid{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;align-items:flex-start}
footer .flogo{height:22px;width:auto;margin-bottom:16px}
footer b{color:#fff}
.fnav{display:flex;gap:18px;flex-wrap:wrap}
.fnav a{text-decoration:none;color:#9AA3BC}
.fnav a:hover{color:#fff}

/* 제품 상세 */
.phead{background:linear-gradient(180deg,#fff,var(--sky-2));padding:68px 0 60px;border-bottom:1px solid var(--line)}
.phead h1{font-size:clamp(36px,5vw,60px);margin-top:20px}
.phead h1 span{display:block;font-size:clamp(18px,2.2vw,26px);font-weight:700;color:var(--blue);margin-top:8px;letter-spacing:-.02em}
.phead .lead{margin-top:20px;font-size:18px}
.phead .where{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px}
.phead .where span{font-size:13px;color:var(--mute);border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}
.video{background:var(--char);aspect-ratio:16/9;position:relative;border-radius:var(--r) var(--r) var(--r) 6px;overflow:hidden;
  box-shadow:0 30px 60px rgba(15,22,38,.2);margin-top:-40px}
.video iframe{width:100%;height:100%;border:0;display:block}
.video__ph{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#9AA3BC}
.video__ph b{color:#fff;font-size:20px;display:block;margin-bottom:6px}
.video__ph span{font-size:14px}
.play{position:absolute;inset:0;border:0;background:rgba(15,22,38,.3);cursor:pointer;display:grid;place-items:center;padding:0}
.play:hover{background:rgba(15,22,38,.15)}
.play i{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 30px rgba(40,72,248,.4)}
.play i::before{content:"";border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:44px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:22px 24px;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px}
.feat i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--grad);color:#fff;font-style:normal;font-weight:800;font-size:13px}
.feat b{display:block;font-size:17px;color:var(--ink);letter-spacing:-.02em}
.feat p{font-size:15px;color:var(--mute);margin-top:6px;line-height:1.6}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:40px}
.shot{margin:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 16px;display:flex;flex-direction:column}
.shot .im{flex:1;display:flex;align-items:center;justify-content:center;min-height:240px;max-height:420px}
.shot img{max-height:400px;width:auto;border-radius:8px}
.shot figcaption{font-size:13.5px;color:var(--mute);margin-top:14px;display:flex;gap:10px;align-items:center}
.shot figcaption i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--blue);background:var(--sky);border-radius:6px;padding:2px 7px;font-weight:700}
.shot--wide{grid-column:1/-1}

@media (max-width:960px){
  .hero .grid{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
  .how__arrow{transform:rotate(90deg);text-align:center}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .figs{grid-template-columns:repeat(2,1fr)}
  .trial{padding:36px 26px}
  .trial .cols,.feats,.sgrid{grid-template-columns:1fr}
  .bar{height:auto;flex-wrap:wrap;padding:12px 0 10px;gap:10px}
  .brand img{height:24px}
  .btn--sm{margin-left:auto}
  nav{order:3;width:100%;margin-left:0;gap:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none}
  nav a i{display:none}
  .sec{padding:64px 0}
  .video{margin-top:0}
}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#/"><img src="images/logo.png" alt="Tkita"></a>
    <nav id="nav"></nav>
    <a class="btn btn--grad btn--sm" id="navCta" href="#">무료 사용</a>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap fgrid">
    <div>
      <img class="flogo" src="images/logo-white.png" alt="Tkita">
      <div><b>개발사 <span id="fMaker"></span> &nbsp;·&nbsp; 총판사 <span id="fSeller"></span></b></div>
      <div id="fAddr"></div>
      <div>Tel. <span id="fTel"></span> &nbsp; Fax. <span id="fFax"></span> &nbsp; <span id="fMail"></span></div>
    </div>
    <div class="fnav" id="fNav"></div>
  </div>
</footer>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');

(function(){
  const links = SITE.products.map(p=>`<a href="#/${p.id}" data-id="${p.id}"><b>${esc(p.name)}</b><i>${esc(p.short)}</i></a>`).join('');
  $('#nav').innerHTML = `<a href="#/" data-id="home"><b>제품 소개</b><i>전체 보기</i></a>` + links;
  $('#navCta').href = SITE.trialUrl;
  $('#fNav').innerHTML = `<a href="#/">제품 소개</a>` + SITE.products.map(p=>`<a href="#/${p.id}">${esc(p.name)} ${esc(p.short)}</a>`).join('');
  $('#fMaker').textContent = SITE.maker; $('#fSeller').textContent = SITE.seller;
  $('#fAddr').textContent = SITE.addr;  $('#fTel').textContent = SITE.tel;
  $('#fFax').textContent = SITE.fax;    $('#fMail').textContent = SITE.email;
})();

/* 자막 패널 데모 */
let demoTimer = [];
function stopDemo(){ demoTimer.forEach(t=>{clearTimeout(t);clearInterval(t);}); demoTimer = []; }
function runDemo(){
  const ko = $('#demoKo'), tr = $('#demoTr'), tc = $('#demoTc');
  if(!ko) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let sec = 0; const clock=()=>{ sec++; if(tc) tc.textContent=`${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec/60)%60)}:${pad(sec%60)}`; };
  demoTimer.push(setInterval(clock,1000));
  let i = 0;
  const step = () => {
    const item = SITE.heroDemo[i % SITE.heroDemo.length];
    const code = l => ({'English':'EN','Tiếng Việt':'VI','中文':'ZH','日本語':'JA','Русский':'RU'}[l] || l.slice(0,2).toUpperCase());
    tr.innerHTML = item.tr.map(([l,t])=>`<div class="cap__row"><span class="cap__lang">${esc(code(l))}</span><span class="cap__txt">${esc(t)}</span></div>`).join('');
    const rows = tr.querySelectorAll('.cap__row');
    if(reduce){ ko.textContent=item.ko; rows.forEach(r=>r.classList.add('show')); demoTimer.push(setTimeout(()=>{i++;step();},5200)); return; }
    ko.innerHTML = '<span class="caret"></span>';
    let c = 0;
    const type = () => { c++; ko.innerHTML = esc(item.ko.slice(0,c)) + '<span class="caret"></span>';
      if(c < item.ko.length) demoTimer.push(setTimeout(type, 50));
      else rows.forEach((r,k)=>demoTimer.push(setTimeout(()=>r.classList.add('show'), 360 + k*240))); };
    demoTimer.push(setTimeout(type, 450));
    demoTimer.push(setTimeout(()=>{ i++; step(); }, 450 + item.ko.length*50 + 3800));
  };
  step();
}

function capHTML(){
  return `<div class="cap">
    <div class="cap__bar"><span class="cap__pill">실시간 자막</span><span class="cap__rec"><i></i><span id="demoTc">00:00:00</span></span></div>
    <div class="cap__body"><div class="cap__ko" id="demoKo"></div><div class="cap__tr" id="demoTr"></div></div>
    <div class="cap__foot"><b>KO</b><span>→</span><b>EN · VI · ZH</b><span style="margin-left:auto">최대 30개 언어 동시</span></div>
  </div>`;
}
function figsHTML(){
  return `<div class="figs">${SITE.stats.map(s=>`<div class="fig"><b>${esc(s.v)}</b><span>${esc(s.k)}</span></div>`).join('')}</div>
    <p class="figs-note">${esc(SITE.statsNote)}</p>`;
}
function trialHTML(){
  return `<section class="sec"><div class="wrap"><div class="trial">
    <h2>먼저 써보고 판단하십시오</h2>
    <div class="cols">${SITE.trial.map(([t,d],i)=>`<div class="col"><b>${esc(t)}</b><p>${esc(d)}</p>
      <a class="btn ${i===0?'btn--white':'btn--ghost'}" href="${esc(i===0?SITE.trialUrl:SITE.applyUrl)}">${i===0?'무료 사용':'기관 도입 문의하기'}</a></div>`).join('')}</div>
  </div></div></section>`;
}
function tk(r){
  if(typeof r==='string') return `<span class="tk">${esc(r)}</span>`;
  return `<span class="tk"><img src="${esc(r.logo)}" alt="${esc(r.name||'')}" loading="lazy"></span>`;
}

function home(){
  const [a,b] = esc(SITE.heroTitle).split(/,\s*/);
  const title = b ? `${a},<br><span class="grad-text">${b}</span>` : esc(SITE.heroTitle);
  return `
  <section class="hero"><div class="wrap grid">
    <div>
      <span class="tag"><i></i>AI 실시간 자막 · 통번역</span>
      <h1>${title}</h1>
      <p class="lead">${esc(SITE.heroText)}</p>
      <div class="cta">
        <a class="btn btn--grad" href="${esc(SITE.trialUrl)}">무료 사용</a>
        <a class="btn btn--line" href="${esc(SITE.applyUrl)}">기관 도입 문의하기</a>
      </div>
      <div class="where">${SITE.products.map(p=>`<span>${esc(p.where.split('·')[0].trim())}</span>`).join('')}</div>
    </div>
    ${capHTML()}
  </div></section>

  <section class="sec sec--sky"><div class="wrap">
    <h2>말하면, 자막이 되고, 각자의 언어가 됩니다</h2>
    <p class="lead">준비는 발표자가 프로그램을 켜는 것뿐입니다. 듣는 사람은 QR을 찍고 자기 언어를 고르면 끝입니다.</p>
    <div class="how">
      <div class="how__step"><span class="n">1</span><b>발표자가 말합니다</b><p>마이크 음성은 물론 PC 재생 영상과 화상회의 상대 음성까지 인식합니다.</p></div>
      <span class="how__arrow">→</span>
      <div class="how__step"><span class="n">2</span><b>즉시 자막이 됩니다</b><p>말하는 동시에 자막이 생기고, 문장이 끝나면 문맥에 맞게 교정됩니다.</p></div>
      <span class="how__arrow">→</span>
      <div class="how__step"><span class="n">3</span><b>각자의 언어로 봅니다</b><p>참석자는 앱 설치 없이 자기 기기에서 원하는 언어로 봅니다.</p>
        <div class="how__langs"><span>EN</span><span>VI</span><span>ZH</span><span>JA</span><span>RU</span><span>+128</span></div></div>
    </div>
  </div></section>

  <section class="sec"><div class="wrap">
    <h2>제품 소개</h2>
    <p class="lead">인식 엔진과 번역 품질, 용어 사전은 네 제품이 모두 같습니다. 쓰는 자리에 맞춰 고르시면 됩니다.</p>
    <div class="tiles">${SITE.products.map(p=>`
      <a class="tile" href="#/${p.id}">
        <div class="tile__art"><img src="${esc(p.shots[0][0])}" alt="${esc(p.name)}" loading="lazy"></div>
        <div class="tile__body"><b>${esc(p.name)}</b><em>${esc(p.short)}</em><p>${esc(p.lead)}</p><u>자세히 보기 →</u></div>
      </a>`).join('')}</div>
  </div></section>

  <section class="sec sec--char"><div class="wrap">
    <h2>측정된 결과로 말씀드립니다</h2>
    ${figsHTML()}
  </div></section>

  <section class="sec sec--sky" style="padding-bottom:72px"><div class="wrap">
    <h2>이미 현장에서 쓰고 있습니다</h2>
    <p class="lead">${esc(SITE.refsLead)}</p>
  </div>
  <div class="ticker"><div class="ticker__track">${[...SITE.refs,...SITE.refs].map(tk).join('')}</div></div>
  </section>

  ${trialHTML()}`;
}

function product(p, n){
  const vid = p.youtube
    ? `<div class="video" data-yt="${esc(p.youtube)}"><img src="https://i.ytimg.com/vi/${esc(p.youtube)}/maxresdefault.jpg" alt="${esc(p.name)} 소개 영상">
       <button class="play" aria-label="${esc(p.name)} 소개 영상 재생"><i></i></button></div>`
    : `<div class="video"><div class="video__ph"><b>소개 영상 준비 중</b><span>영상이 올라오면 이 자리에서 바로 재생됩니다.</span></div></div>`;
  const shots = p.shots.map(([src,cap],i)=>{
    const wide = /talk-hw|caption-phones|mobile-invite|meet-app/.test(src);
    return `<figure class="shot${wide?' shot--wide':''}"><div class="im"><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"></div>
      <figcaption><i>${pad(i+1)}</i>${esc(cap)}</figcaption></figure>`; }).join('');
  return `
  <section class="phead"><div class="wrap">
    <span class="tag"><i></i>제품 ${pad(n)} · ${esc(p.tag)}</span>
    <h1>${esc(p.name)}<span>${esc(p.short)}</span></h1>
    <p class="lead">${esc(p.lead)}</p>
    <div class="where">${p.where.split('·').map(w=>`<span>${esc(w.trim())}</span>`).join('')}</div>
  </div></section>

  <section class="sec" style="padding-top:0"><div class="wrap">
    ${vid}
    <div class="feats">${p.feats.map(([t,d],i)=>`<div class="feat"><i>${pad(i+1)}</i><div><b>${esc(t)}</b><p>${esc(d)}</p></div></div>`).join('')}</div>
  </div></section>

  <section class="sec sec--sky" style="padding-top:72px"><div class="wrap">
    <h2>실제 화면</h2>
    <div class="sgrid">${shots}</div>
  </div></section>

  <section class="sec sec--char"><div class="wrap">
    <h2>성능은 네 제품이 같습니다</h2>
    ${figsHTML()}
  </div></section>

  ${trialHTML()}`;
}

function route(){
  stopDemo();
  const id = (location.hash.replace('#/','') || 'home').trim();
  const idx = SITE.products.findIndex(x=>x.id===id);
  const p = SITE.products[idx];
  $('#app').innerHTML = p ? product(p, idx+1) : home();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.id===(p?id:'home')));
  document.title = p ? `${p.name} ${p.short} — ${p.tag} | Tkita` : 'Tkita — AI 실시간 자막·통번역 솔루션';
  window.scrollTo(0,0);
  if(!p) runDemo();
  const v = $('.video[data-yt]');
  if(v) v.querySelector('.play').addEventListener('click',()=>{
    v.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.dataset.yt}?autoplay=1&rel=0" title="소개 영상"
      allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;
  });
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
