<style>
:root{
  --ink:#0B2545; --ink-2:#15355C; --blue:#1E5FBF; --cyan:#3FC1FF;
  --body:#25313F; --muted:#6A7A8C; --line:#D8E2F0; --mist:#EEF3FA; --paper:#fff;
  --mx:1120px;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f);color:var(--body);background:var(--paper);
     font-size:17px;line-height:1.72;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--mx);margin:0 auto;padding:0 24px}
h1,h2,h3{color:var(--ink);line-height:1.3;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(32px,5vw,52px);font-weight:800}
h2{font-size:clamp(24px,3.2vw,34px);font-weight:800}
h3{font-size:20px;font-weight:700}
p{margin:0}
.sec{padding:84px 0}
.sec--mist{background:var(--mist)}
.lead{color:var(--muted);margin-top:14px;max-width:62ch;white-space:pre-line}

/* 상단 바 */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;height:66px}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:30px;width:auto}
.flogo{height:26px;width:auto;margin-bottom:14px;opacity:.95}
nav{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
nav a{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;
  color:var(--body);padding:4px 2px;border-bottom:2px solid transparent;line-height:1.25}
nav a b{font-size:14px;font-weight:700;letter-spacing:-.02em}
nav a i{font-style:normal;font-size:11.5px;color:var(--muted)}
nav a:hover,nav a.on{color:var(--blue);border-color:var(--blue)}
nav a:hover i,nav a.on i{color:var(--blue)}
.btn{display:inline-block;border-radius:8px;padding:12px 22px;font-weight:700;font-size:16px;
  text-decoration:none;border:1.5px solid transparent;cursor:pointer}
.btn--fill{background:var(--blue);color:#fff}
.btn--fill:hover{background:#174c9c}
.btn--line{border-color:var(--line);color:var(--ink);background:#fff}
.btn--line:hover{border-color:var(--blue);color:var(--blue)}
.btn--ghost{border-color:rgba(255,255,255,.4);color:#fff}
.btn--ghost:hover{background:rgba(255,255,255,.12)}
.btn--sm{padding:9px 16px;font-size:14px}

/* 첫 화면 */
.hero{background:var(--ink);color:#fff;padding:92px 0 84px}
.hero h1{color:#fff}
.hero .lead{color:#B9CFE8}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.demo{margin-top:52px;background:#08182B;border:1px solid #1D3E63;border-radius:14px;overflow:hidden}
.demo__bar{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#102A47;border-bottom:1px solid #1D3E63}
.dot{width:9px;height:9px;border-radius:50%;background:#375E8A}
.demo__label{margin-left:8px;font-size:13px;color:#7FA3CC}
.demo__live{margin-left:auto;font-size:12px;color:var(--cyan);display:flex;align-items:center;gap:7px}
.demo__live i{width:7px;height:7px;border-radius:50%;background:var(--cyan);display:block;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.demo__body{padding:26px 22px 28px}
.demo__ko{font-size:clamp(18px,2.4vw,25px);font-weight:700;color:#fff;min-height:2.2em}
.demo__ko .caret{display:inline-block;width:2px;height:1em;background:var(--cyan);vertical-align:-2px;margin-left:3px;animation:blink 1s infinite}
.demo__tr{margin-top:20px;display:grid;gap:9px}
.demo__row{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:baseline;
  opacity:0;transform:translateY(5px);transition:opacity .45s ease,transform .45s ease}
.demo__row.show{opacity:1;transform:none}
.demo__lang{font-size:12px;color:var(--cyan);font-weight:600}
.demo__txt{font-size:15px;color:#CFE0F2}

/* 숫자 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:40px}
.stat{background:#fff;padding:26px 20px}
.stat b{display:block;font-size:30px;font-weight:800;color:var(--blue);letter-spacing:-.03em}
.stat span{display:block;font-size:14px;color:var(--muted);margin-top:6px}
.note{font-size:13px;color:var(--muted);margin-top:14px}

/* 제품 목록 */
.plist{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:40px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:28px 26px 24px;background:#fff;
  text-decoration:none;display:block;transition:border-color .2s,box-shadow .2s}
.pcard:hover{border-color:var(--blue);box-shadow:0 6px 22px rgba(11,37,69,.08)}
.pcard b{font-size:21px;color:var(--ink);display:block;letter-spacing:-.02em}
.pcard b span{display:block;font-size:16px;font-weight:700;color:var(--blue);margin-top:2px}
.pcard em{font-style:normal;font-size:14px;color:var(--blue);display:block;margin-top:4px}
.pcard p{margin-top:14px;font-size:15px;color:var(--body)}
.pcard u{display:inline-block;margin-top:16px;font-size:14px;color:var(--blue);text-decoration:none;font-weight:600}

/* 레퍼런스 자동 슬라이드 */
.marquee{margin-top:32px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.marquee__track{display:flex;width:max-content;gap:14px;animation:slide 38s linear infinite}
.marquee:hover .marquee__track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.chip{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:13px 26px;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;
  display:flex;align-items:center;justify-content:center;min-height:64px}
.chip--logo{padding:12px 24px}
.chip--logo img{height:38px;width:auto;max-width:190px;object-fit:contain;display:block}
@media (prefers-reduced-motion:reduce){
  /* 시스템에서 애니메이션을 꺼둔 경우 — 흐르지는 않지만 한 줄로 유지하고 손으로 넘길 수 있게 */
  .marquee{overflow-x:auto;scrollbar-width:thin}
  .marquee__track{animation:none}
  .demo__row{transition:none}
}

/* 제품 상세 */
.phead{background:var(--ink);color:#fff;padding:64px 0 56px}
.phead h1{color:#fff;font-size:clamp(28px,4vw,42px)}
.phead h1 span{display:block;color:var(--cyan);font-size:clamp(18px,2.4vw,26px);margin-top:6px}
.phead .tagline{color:var(--cyan);font-weight:700;font-size:15px;margin-bottom:12px}
.phead .lead{color:#B9CFE8}
.phead .where{margin-top:26px;font-size:14px;color:#8FB4DA;border-top:1px solid #1D3E63;padding-top:18px}
.video{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;position:relative;
  margin-top:40px;border:1px solid var(--line)}
.video iframe{width:100%;height:100%;border:0;display:block}
.video__ph{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;
  background:var(--mist);color:var(--muted)}
.video__ph b{color:var(--ink);font-size:18px}
.video__ph span{font-size:14px}
.play{position:absolute;inset:0;display:grid;place-items:center;border:0;background:rgba(8,24,43,.35);cursor:pointer;padding:0}
.play:hover{background:rgba(8,24,43,.2)}
.play i{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.3)}
.play i::before{content:"";border-left:20px solid var(--blue);border-top:12px solid transparent;
  border-bottom:12px solid transparent;margin-left:5px}
.feats{margin-top:48px;border-top:1px solid var(--line)}
.feat{display:grid;grid-template-columns:250px 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.feat b{font-size:17px;color:var(--ink)}
.feat p{font-size:16px}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:40px}
.shot{background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;
  display:flex;flex-direction:column;justify-content:space-between}
.shot img{margin:0 auto;max-height:340px;width:auto;border-radius:6px}
.shot span{display:block;font-size:13px;color:var(--muted);margin-top:auto;padding-top:16px}

/* 무료 체험 */
.trial{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:38px}
.tcard{border:1px solid #2C5480;border-radius:14px;padding:28px 26px;background:var(--ink-2)}
.tcard b{display:block;color:var(--cyan);font-size:19px;margin-bottom:10px}
.tcard p{color:#C6D9EC;font-size:15px}

/* 바닥 */
footer{background:var(--ink);color:#9FBCDA;padding:56px 0 44px;font-size:14px}
footer b{color:#fff}
.fgrid{display:flex;gap:48px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.fnav{display:flex;gap:18px;flex-wrap:wrap}
.fnav a{text-decoration:none;color:#9FBCDA}
.fnav a:hover{color:#fff}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .plist,.trial{grid-template-columns:1fr}
  .feat{grid-template-columns:1fr;gap:6px;padding:18px 0}
  .sec{padding:60px 0}
  nav{gap:14px}
  nav a{font-size:14px}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#/"><img src="images/logo.png" alt="Tkita"></a>
    <nav id="nav"></nav>
    <a class="btn btn--fill btn--sm" id="navCta" href="#">무료 사용</a>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap fgrid">
    <div>
      <img class="flogo" src="images/logo-white.png" alt="Tkita">
      <b>개발사 <span id="fMaker"></span> &nbsp;|&nbsp; 총판사 <span id="fSeller"></span></b><br>
      <span id="fAddr"></span><br>
      Tel. <span id="fTel"></span> &nbsp; Fax. <span id="fFax"></span> &nbsp; <span id="fMail"></span>
    </div>
    <div class="fnav" id="fNav"></div>
  </div>
</footer>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 상단 / 바닥 공통 */
(function(){
  const links = SITE.products.map(p=>
    `<a href="#/${p.id}" data-id="${p.id}"><b>${esc(p.name)}</b><i>${esc(p.short)}</i></a>`).join('');
  $('#nav').innerHTML = `<a href="#/" data-id="home"><b>제품 소개</b><i>전체 보기</i></a>` + links;
  $('#navCta').href = SITE.trialUrl;
  $('#fNav').innerHTML = `<a href="#/">제품 소개</a>` + SITE.products.map(p=>`<a href="#/${p.id}">${esc(p.name)} ${esc(p.short)}</a>`).join('');
  $('#fMaker').textContent = SITE.maker; $('#fSeller').textContent = SITE.seller;
  $('#fAddr').textContent = SITE.addr;  $('#fTel').textContent = SITE.tel;
  $('#fFax').textContent = SITE.fax;    $('#fMail').textContent = SITE.email;
})();

/* ── 첫 화면 자막 데모 ───────────────────────────────── */
let demoTimer = [];
function stopDemo(){ demoTimer.forEach(clearTimeout); demoTimer = []; }
function runDemo(){
  const ko = $('#demoKo'), tr = $('#demoTr');
  if(!ko) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0;
  const step = () => {
    const item = SITE.heroDemo[i % SITE.heroDemo.length];
    tr.innerHTML = item.tr.map(([l,t])=>
      `<div class="demo__row"><span class="demo__lang">${esc(l)}</span><span class="demo__txt">${esc(t)}</span></div>`).join('');
    const rows = tr.querySelectorAll('.demo__row');
    if(reduce){
      ko.textContent = item.ko; rows.forEach(r=>r.classList.add('show'));
      demoTimer.push(setTimeout(()=>{ i++; step(); }, 5200)); return;
    }
    ko.innerHTML = '<span class="caret"></span>';
    let c = 0;
    const type = () => {
      c++;
      ko.innerHTML = esc(item.ko.slice(0,c)) + '<span class="caret"></span>';
      if(c < item.ko.length) demoTimer.push(setTimeout(type, 52));
      else rows.forEach((r,k)=>demoTimer.push(setTimeout(()=>r.classList.add('show'), 380 + k*260)));
    };
    demoTimer.push(setTimeout(type, 500));
    demoTimer.push(setTimeout(()=>{ i++; step(); }, 500 + item.ko.length*52 + 3600));
  };
  step();
}

/* ── 화면 그리기 ─────────────────────────────────────── */
function chip(r){
  if(typeof r === 'string') return `<span class="chip">${esc(r)}</span>`;
  return `<span class="chip chip--logo"><img src="${esc(r.logo)}" alt="${esc(r.name||'')}" loading="lazy"></span>`;
}
function statsHTML(){
  return `<div class="stats">${SITE.stats.map(s=>
    `<div class="stat"><b>${esc(s.v)}</b><span>${esc(s.k)}</span></div>`).join('')}</div>
    <p class="note">${esc(SITE.statsNote)}</p>`;
}
function trialHTML(){
  return `<section class="sec" style="background:var(--ink)">
    <div class="wrap">
      <h2 style="color:#fff">먼저 써보고 판단하십시오</h2>
      <div class="trial">${SITE.trial.map(([t,d])=>
        `<div class="tcard"><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}</div>
      <div class="cta" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:30px">
        <a class="btn btn--fill" href="${esc(SITE.trialUrl)}">무료 사용</a>
        <a class="btn btn--ghost" href="${esc(SITE.applyUrl)}">기관 도입 문의하기</a>
      </div>
    </div></section>`;
}

function home(){
  return `
  <section class="hero"><div class="wrap">
    <h1>${esc(SITE.heroTitle)}</h1>
    <p class="lead">${esc(SITE.heroText)}</p>
    <div class="cta">
      <a class="btn btn--fill" href="${esc(SITE.trialUrl)}">무료 사용</a>
      <a class="btn btn--ghost" href="${esc(SITE.applyUrl)}">기관 도입 문의하기</a>
    </div>
    <div class="demo">
      <div class="demo__bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i>
        <span class="demo__label">Tkita 실시간 자막</span>
        <span class="demo__live"><i></i>변환 중</span></div>
      <div class="demo__body">
        <div class="demo__ko" id="demoKo"></div>
        <div class="demo__tr" id="demoTr"></div>
      </div>
    </div>
  </div></section>

  <section class="sec"><div class="wrap">
    <h2>제품 소개</h2>
    <p class="lead">인식 엔진과 번역 품질, 용어 사전은 네 제품이 모두 같습니다. 다른 것은 쓰는 환경뿐입니다.</p>
    <div class="plist">${SITE.products.map(p=>`
      <a class="pcard" href="#/${p.id}">
        <b>${esc(p.name)}<span>${esc(p.short)}</span></b><em>${esc(p.tag)}</em>
        <p>${esc(p.lead)}</p><u>자세히 보기</u>
      </a>`).join('')}</div>
  </div></section>

  <section class="sec sec--mist"><div class="wrap">
    <h2>측정된 결과로 말씀드립니다</h2>
    ${statsHTML()}
  </div></section>

  <section class="sec"><div class="wrap">
    <h2>이미 현장에서 쓰고 있습니다</h2>
    <p class="lead">${esc(SITE.refsLead)}</p>
  </div>
  <div class="marquee"><div class="marquee__track">
    ${[...SITE.refs,...SITE.refs].map(chip).join('')}
  </div></div></section>

  ${trialHTML()}`;
}

function product(p){
  const vid = p.youtube
    ? `<div class="video" data-yt="${esc(p.youtube)}">
         <img src="https://i.ytimg.com/vi/${esc(p.youtube)}/maxresdefault.jpg" alt="${esc(p.name)} 소개 영상">
         <button class="play" aria-label="${esc(p.name)} 소개 영상 재생"><i></i></button>
       </div>`
    : `<div class="video"><div class="video__ph">
         <b>소개 영상 준비 중입니다</b>
         <span>영상이 올라오면 이 자리에서 바로 재생됩니다.</span></div></div>`;
  return `
  <section class="phead"><div class="wrap">
    <p class="tagline">${esc(p.tag)}</p>
    <h1>${esc(p.name)}<span>${esc(p.short)}</span></h1>
    <p class="lead">${esc(p.lead)}</p>
    <p class="where">쓰는 자리 &nbsp; ${esc(p.where)}</p>
  </div></section>

  <section class="sec"><div class="wrap">
    ${vid}
    <div class="feats">${p.feats.map(([t,d])=>
      `<div class="feat"><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}</div>
  </div></section>

  <section class="sec sec--mist"><div class="wrap">
    <h2>실제 화면</h2>
    <div class="shots">${p.shots.map(([src,cap])=>
      `<figure class="shot" style="margin:0"><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"><span>${esc(cap)}</span></figure>`).join('')}</div>
  </div></section>

  <section class="sec"><div class="wrap">
    <h2>성능은 네 제품이 같습니다</h2>
    ${statsHTML()}
  </div></section>

  ${trialHTML()}`;
}

function route(){
  stopDemo();
  const id = (location.hash.replace('#/','') || 'home').trim();
  const p = SITE.products.find(x=>x.id===id);
  $('#app').innerHTML = p ? product(p) : home();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.id===(p?id:'home')));
  document.title = p ? `${p.name} — ${p.tag} | Tkita` : 'Tkita — AI 실시간 자막·통번역 솔루션';
  window.scrollTo(0,0);
  if(!p) runDemo();
  const v = $('.video[data-yt]');
  if(v) v.querySelector('.play').addEventListener('click',()=>{
    v.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.dataset.yt}?autoplay=1&rel=0"
      title="소개 영상" allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture"
      allowfullscreen></iframe>`;
  });
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
