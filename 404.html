<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | Tkita</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--blue:#2848F8;--ink:#0F1626;--mute:#66708A;--line:#E1E6F5;--sky:#F6F8FF;
  --grad:linear-gradient(135deg,#3F6BFF 0%,#2848F8 55%,#1B36D6 100%);
  --f:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);background:linear-gradient(180deg,#fff,var(--sky));color:#1E2430;
  min-height:100vh;display:grid;place-content:center;text-align:center;padding:40px 24px}
img.logo{height:28px;margin:0 auto 40px}
.code{font-size:clamp(64px,12vw,120px);font-weight:800;letter-spacing:-.05em;line-height:1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(22px,3.4vw,32px);color:var(--ink);margin:18px 0 0;letter-spacing:-.03em}
p{color:var(--mute);margin:14px 0 0;line-height:1.7}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
a.btn{display:inline-flex;align-items:center;padding:14px 24px;border-radius:12px;font-weight:700;
  font-size:16px;text-decoration:none;border:1.5px solid transparent}
.fill{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(40,72,248,.28)}
.line{border-color:var(--line);color:var(--ink);background:#fff}
small{display:block;margin-top:40px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
  <img class="logo" src="/images/logo.png" alt="Tkita">
  <div class="code">404</div>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 입력되었을 수 있습니다.<br>아래에서 원하시는 곳으로 이동해 주십시오.</p>
  <div class="cta">
    <a class="btn fill" href="/">제품 소개로 가기</a>
    <a class="btn line" href="/#/contact">도입 문의하기</a>
  </div>
  <small>개발사 ㈜에어사운드 &nbsp;·&nbsp; 총판사 ㈜드림아이티 &nbsp;·&nbsp; 051-507-6114</small>
</body>
</html>
